<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>वीडियो डाउनलोड</title>
<style>
:root{--bg:#f6f5f1;--fg:#1c1b19;--btn:#1f6feb;--btnfg:#fff;--mut:#6b6a66;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161615;--fg:#f0eee9;--btn:#4c8dff;--btnfg:#0b0b0b;--mut:#9a988f}}
:root[data-theme="dark"]{--bg:#161615;--fg:#f0eee9;--btn:#4c8dff;--btnfg:#0b0b0b;--mut:#9a988f}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
button{font:inherit;font-size:1.2rem;font-weight:600;background:var(--btn);color:var(--btnfg);border:0;border-radius:14px;padding:18px 32px;cursor:pointer;max-width:100%}
button:disabled{opacity:.6}
p{color:var(--mut);margin:16px 0 0;min-height:1.4em}
</style>
</head>
<body>
<main>
<button id="b" disabled>⬇ वीडियो डाउनलोड करें</button>
<p id="m"></p>
</main>
<script>
var URL_ID="/_blob/077aeaff8cabbf3bf89c680410482997";
var b=document.getElementById("b"),m=document.getElementById("m");
var dl=null;
(async function(){
  try{dl=await claude.use("downloads");}catch(e){dl=null;}
  b.disabled=false;
})();
b.addEventListener("click",async function(){
  b.disabled=true;m.textContent="तैयार हो रहा है…";
  try{
    var r=await fetch(URL_ID);var blob=await r.blob();
    if(dl){
      await dl.save({filename:"video.mp4",data:blob});
    }else{
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="video.mp4";document.body.appendChild(a);a.click();a.remove();
    }
    m.textContent="";
  }catch(e){m.textContent="डाउनलोड नहीं हो सका, दोबारा कोशिश करें।";}
  b.disabled=false;
});
</script>
</body>
</html>
